<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 생각 작업공간</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 통합자 관리: CSS 변수 (모든 모듈에서 사용) -->
  <link rel="stylesheet" href="css/_variables.css">

  <!-- 기본 스타일 -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 모듈별 CSS (Phase 순서대로) -->
  <!-- Phase 1 -->
  <link rel="stylesheet" href="css/module-e-icons.css">
  <link rel="stylesheet" href="css/module-a-header.css">
  <link rel="stylesheet" href="css/module-b-home.css">
  <!-- Phase 2 -->
  <link rel="stylesheet" href="css/module-c-dropdown.css">
  <link rel="stylesheet" href="css/module-d-dropdowns.css">
  <link rel="stylesheet" href="css/module-f-messages.css">
  <!-- Phase 3 -->
  <link rel="stylesheet" href="css/module-g-input.css">
  <link rel="stylesheet" href="css/module-h-tabs.css">

  <!-- 새 모듈 시스템 CSS -->
  <link rel="stylesheet" href="css/new-modules.css">

  <!-- 테마 초기화 (깜빡임 방지) -->
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- ===== 새 모듈 시스템 DOM 요소 (통합자 관리) ===== -->

  <!-- SidePanel 오버레이 -->
  <div id="side-panel-overlay" class="side-panel-overlay"></div>

  <!-- SidePanel -->
  <aside id="side-panel" class="side-panel">
    <!-- SidePanel.render()가 내용 채움 -->
  </aside>

  <!-- Dock Panel Container (EdgeDock 패널 내용) -->
  <div id="dock-panel-container" class="dock-panel-container">
    <div class="dock-panel" data-panel="tree">
      <!-- TreeManager가 렌더링 -->
    </div>
    <div class="dock-panel" data-panel="workspace">
      <!-- 작업공간 패널 -->
    </div>
    <div class="dock-panel" data-panel="advisor">
      <!-- 조언자 패널 -->
    </div>
    <div class="dock-panel" data-panel="docs">
      <!-- 문서 패널 -->
    </div>
  </div>

  <!-- ===== 기존 앱 컨테이너 ===== -->
  <div class="app-container">
    <!-- 헤더 (새 AppHeader용 id 추가) -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <!-- 햄버거 버튼 (SidePanel 열기) -->
        <button class="header-hamburger" id="hamburger-btn" aria-label="메뉴 열기">
          <span class="hamburger-icon">☰</span>
        </button>
        <div class="logo">
          <span class="logo-icon" aria-hidden="true">🧠</span>
        </div>

        <!-- 모듈 A: 작업공간 선택 버튼 -->
        <div class="workspace-selector" id="workspace-selector">
          <button
            class="workspace-selector-btn"
            id="workspace-selector-btn"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="workspace-name" id="current-workspace-name">마케팅 전략</span>
            <span class="workspace-chevron" aria-hidden="true"></span>
          </button>

          <!-- 모듈 C: 작업공간 드롭다운 -->
          <div class="workspace-dropdown" id="workspace-dropdown" role="listbox" hidden>
            <!-- 검색 영역 -->
            <div class="dropdown-search">
              <svg class="dropdown-search-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
              </svg>
              <input
                type="search"
                class="dropdown-search-input"
                id="workspace-dropdown-search"
                placeholder="검색..."
                aria-label="작업공간 검색"
              >
            </div>

            <!-- 작업공간 목록 -->
            <div class="dropdown-list" id="workspace-dropdown-list" role="group" aria-label="작업공간 목록">
              <!-- 항목들이 JS에서 동적 렌더링 -->
            </div>

            <!-- 하단 액션 -->
            <div class="dropdown-footer">
              <button class="dropdown-action" id="dropdown-new-workspace">
                <svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14"/><path d="M12 5v14"/>
                </svg>
                <span>새 작업공간</span>
              </button>
              <button class="dropdown-action" id="dropdown-view-all">
                <svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>모든 작업공간 보기</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="header-right">
        <!-- 설정 아이콘 -->
        <button class="header-icon-btn" id="settings-btn" aria-label="설정" aria-haspopup="menu">
          <svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>

        <!-- 계정 아이콘 -->
        <button class="header-icon-btn account-btn" id="account-btn" aria-label="계정 메뉴" aria-haspopup="menu">
          <span class="account-avatar" id="account-avatar">DK</span>
        </button>
      </div>
    </header>

    <!-- 홈 화면 (기본 표시) -->
    <main class="home-view" id="home-view">
      <div class="home-container">
        <!-- 헤더 영역 -->
        <div class="home-header">
          <h1 class="home-title">내 작업공간</h1>
          <p class="home-subtitle">생각을 가지치기하세요</p>
        </div>

        <!-- 검색 + 새로 만들기 -->
        <div class="home-actions">
          <div class="search-wrapper">
            <svg class="search-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
            <input
              type="search"
              class="search-input"
              id="workspace-search"
              placeholder="작업공간 검색..."
              aria-label="작업공간 검색"
            >
          </div>

          <button class="btn-new-workspace" id="btn-new-workspace">
            <svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/><path d="M12 5v14"/>
            </svg>
            <span>새 작업공간</span>
          </button>
        </div>

        <!-- 작업공간 목록 -->
        <div class="home-workspace-list" id="home-workspace-list" role="list">
          <!-- 카드들이 동적으로 렌더링 -->
        </div>

        <!-- 빈 상태 -->
        <div class="home-empty-state" id="home-empty-state" hidden>
          <svg class="empty-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>
          </svg>
          <p class="empty-text">아직 작업공간이 없습니다</p>
          <button class="btn-new-workspace" id="btn-new-workspace-empty">
            <svg class="icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/><path d="M12 5v14"/>
            </svg>
            <span>첫 작업공간 만들기</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 작업공간 화면 (숨김) -->
    <main class="workspace-view" id="workspace-view" hidden>
      <div class="app-main">
        <!-- 드롭 프리뷰 인디케이터 -->
        <div class="drop-preview drop-preview-left" id="drop-preview-left"></div>
      <div class="drop-preview drop-preview-right" id="drop-preview-right"></div>

      <!-- 드롭존 -->
      <div class="drop-zone drop-zone-left" id="drop-zone-left"></div>
      <div class="drop-zone drop-zone-right" id="drop-zone-right"></div>

      <!-- 좌측 엣지 독: 구조를 본다 -->
      <div class="edge-dock edge-dock-left" id="edge-dock-left">
        <button class="edge-dock-btn" id="dock-tree" data-panel="sidebar" aria-label="생각 트리 열기">
          <span class="edge-dock-icon">🌳</span>
          <span class="edge-dock-label">생각 트리</span>
        </button>
      </div>

      <!-- 좌측: 트리 사이드바 -->
      <aside class="sidebar collapsed" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-icon">🎯</span>
          <span class="sidebar-title">마케팅 전략 기획</span>
          <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="사이드바 닫기">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <div class="tree-container" id="tree-container">
          <!-- 트리 노드들이 JS로 렌더링됨 -->
        </div>

        <div class="sidebar-footer">
          <button class="new-branch-btn" id="new-branch-btn">+ 새 가지 추가</button>
          <button class="fork-view-btn" id="fork-view-btn" aria-label="포크 뷰로 보기">
            <span class="fork-view-icon">🌿</span>
            <span class="fork-view-label">포크 뷰</span>
          </button>
        </div>
      </aside>
      
      <!-- 사이드바 리사이즈 핸들 -->
      <div class="resize-handle resize-handle-left" id="resize-sidebar"></div>

      <!-- 중앙: 채팅 영역 -->
      <section class="chat-area" id="chat-area">
        <!-- 새 ChatHeader -->
        <header id="chat-header" class="chat-header">
          <!-- ChatHeader.render()가 내용 채움 -->
        </header>

        <!-- 기존 채팅 헤더 (레거시) -->
        <div class="chat-header-legacy" style="display:none;">
          <h2 class="chat-title" id="chat-title">채널 전략</h2>
          <div class="chat-breadcrumb" id="chat-breadcrumb">마케팅 전략 → 채널 전략</div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
          <!-- 환영 메시지 (대화 없을 때 표시) -->
          <div class="chat-welcome" id="chat-welcome">
            <div class="chat-welcome-icon">🧠</div>
            <h2 class="chat-welcome-title">무엇을 생각하고 계신가요?</h2>
            <p class="chat-welcome-desc">질문을 입력하면 AI가 함께 생각을 정리해드려요</p>
            <div class="chat-welcome-hints">
              <button class="chat-welcome-hint" data-hint="아이디어 정리">💡 아이디어 정리하기</button>
              <button class="chat-welcome-hint" data-hint="전략 분석">📊 전략 분석하기</button>
              <button class="chat-welcome-hint" data-hint="글쓰기 도움">✍️ 글쓰기 도움받기</button>
            </div>
          </div>
          <!-- 메시지들이 JS로 렌더링됨 -->
        </div>

        <!-- 모듈 2: 컨텍스트 바 -->
        <div class="context-bar" id="context-bar">
          <div class="context-mode">
            <span class="context-icon" id="context-icon">🤖</span>
            <span class="context-text" id="context-text">AI와 대화 중</span>
          </div>
          <div class="context-actions" id="context-actions"></div>
        </div>

        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <label for="chat-input" class="sr-only">메시지 입력</label>
            <input
              type="text"
              class="chat-input"
              id="chat-input"
              placeholder="이 지점에서 이어서 대화하기..."
              aria-label="메시지 입력"
            />
            <button class="send-btn" id="send-btn" aria-label="메시지 전송">
              <span aria-hidden="true">➤</span>
            </button>
          </div>
        </div>
      </section>

      <!-- 패널 리사이즈 핸들 -->
      <div class="resize-handle resize-handle-right" id="resize-panel"></div>

      <!-- 우측: 다중 관점 패널 -->
      <!-- 우측 엣지 독: 관점을 넓힌다 -->
      <div class="edge-dock edge-dock-right" id="edge-dock-right">
        <button class="edge-dock-btn" id="dock-expand" aria-label="관점 도구 열기">
          <span class="edge-dock-icon">💡</span>
          <span class="edge-dock-label">관점 도구</span>
        </button>
        <!-- 미니 메뉴 (2-tap 폴더) -->
        <div class="edge-dock-menu" id="dock-menu">
          <button class="edge-dock-menu-item" data-panel="perspectives">
            <span class="edge-dock-icon">🎭</span>
            <span>조언자</span>
          </button>
          <button class="edge-dock-menu-item" data-panel="sources">
            <span class="edge-dock-icon">📄</span>
            <span>문서</span>
          </button>
        </div>
      </div>

      <aside class="panel collapsed" id="panel">
        <div class="panel-header">
          <div class="panel-title-area">
            <span class="panel-current-icon" id="panel-current-icon">🎭</span>
            <span class="panel-title" id="panel-title">조언자</span>
          </div>
          <div class="panel-actions">
            <button class="panel-switch-btn" id="panel-switch-btn" data-switch-to="sources">
              <span class="panel-switch-icon">📄</span>
              <span class="panel-switch-name">문서</span>
            </button>
            <button class="panel-close-btn" id="panel-close-btn" aria-label="패널 닫기">
              <span aria-hidden="true">×</span>
            </button>
          </div>
        </div>
        
        <div class="panel-content" id="panel-content">
          <!-- 패널 내용이 JS로 렌더링됨 -->
        </div>
        
        <div class="panel-footer">
          <button class="add-perspective-btn" id="add-perspective-btn">+ 전문가 초대하기</button>
        </div>
      </aside>
      </div><!-- .app-main end -->
    </main><!-- .workspace-view end -->

    <!-- 하단 토글바: 엣지 독으로 대체됨 -->
  </div>

  <!-- 배치 설정 모달 -->
  <div class="layout-modal-overlay" id="layout-modal-overlay">
    <div class="layout-modal" id="layout-modal">
      <div class="layout-modal-header">
        <span class="layout-modal-title">나의 작업공간 배치</span>
        <button class="layout-modal-close" id="layout-modal-close" aria-label="닫기">
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <div class="layout-modal-body">
        <div class="layout-slots">
          <div class="layout-slot layout-slot-left" id="layout-slot-left" data-position="left">
            <div class="layout-box" id="layout-box-sidebar" draggable="true" data-panel="sidebar">
              <span class="layout-box-icon">🌳</span>
              <span class="layout-box-name">생각 트리</span>
              <span class="layout-box-help" data-tooltip="대화의 흐름을 나무 구조로 봅니다. 지금 어디에 있는지 확인할 수 있어요.">?</span>
            </div>
          </div>

          <div class="layout-slot layout-slot-center">
            <div class="layout-box layout-box-fixed">
              <span class="layout-box-icon">💬</span>
              <span class="layout-box-name">채팅 영역</span>
            </div>
          </div>

          <div class="layout-slot layout-slot-right" id="layout-slot-right" data-position="right">
            <div class="layout-box" id="layout-box-panel" draggable="true" data-panel="panel">
              <span class="layout-box-icon">💡</span>
              <span class="layout-box-name">관점 도구</span>
              <span class="layout-box-help" data-tooltip="다양한 전문가 관점으로 생각을 넓혀줍니다. 새로운 시각을 발견할 수 있어요.">?</span>
            </div>
          </div>
        </div>

        <p class="layout-hint">↔ 패널을 드래그하여 배치하세요</p>
      </div>
    </div>
  </div>

  <!-- 포크 뷰 모달 -->
  <div class="fork-view-overlay" id="fork-view-overlay">
    <div class="fork-view-modal">
      <div class="fork-view-header">
        <div class="fork-view-title">
          <span class="fork-view-title-icon">🌿</span>
          <span class="fork-view-title-text">대화 포크 뷰</span>
        </div>
        <div class="fork-view-controls">
          <button class="fork-view-zoom-btn" id="fork-zoom-out" aria-label="축소">-</button>
          <button class="fork-view-zoom-btn" id="fork-zoom-reset" aria-label="100%">100%</button>
          <button class="fork-view-zoom-btn" id="fork-zoom-in" aria-label="확대">+</button>
          <button class="fork-view-close-btn" id="fork-view-close-btn" aria-label="닫기">
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </div>
      <div class="fork-view-canvas" id="fork-view-canvas">
        <!-- D3.js SVG가 여기에 렌더링됨 -->
      </div>
      <div class="fork-view-minimap" id="fork-view-minimap">
        <!-- 미니맵 (나중에 구현) -->
      </div>
    </div>
  </div>

  <!-- D3.js Library -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- 통합자 관리: 모듈 초기화 시스템 (ES Module) -->
  <script type="module" src="js/_init.js"></script>

  <!-- 코어 유틸리티 -->
  <script src="js/data.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/panel.js"></script>

  <!-- 모듈별 스크립트 (Phase 순서대로) -->
  <!-- Phase 1: 기반 모듈 (병렬 가능) -->
  <script src="js/module-e-icons.js"></script>
  <script src="js/module-a-header.js"></script>
  <script src="js/module-b-home.js"></script>

  <!-- Phase 2: Phase 1 의존 모듈 -->
  <script src="js/module-c-dropdown.js"></script>
  <script src="js/module-d-dropdowns.js"></script>
  <script src="js/module-f-messages.js"></script>

  <!-- Phase 3: 최종 모듈 -->
  <script src="js/module-g-input.js"></script>

  <!-- 탭 시스템: modules/tab-manager.js (ES Module, _init.js에서 import) -->

  <!-- 앱 초기화 -->
